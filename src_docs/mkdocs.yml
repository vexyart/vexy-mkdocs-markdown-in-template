# this_file: src_docs/mkdocs.yml
site_name: vexy-mkdocs-markdown-in-template
site_description: A MkDocs plugin that lets you use Markdown inside the theme's Jinja2 template files.
site_url: https://vexy.dev/vexy-mkdocs-markdown-in-template/
repo_url: https://github.com/vexyart/vexy-mkdocs-markdown-in-template
repo_name: vexyart/vexy-mkdocs-markdown-in-template
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  # The override in overrides/main.html uses the plugin's {% md %} block (dog-fooding).
  custom_dir: overrides
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
  # The plugin itself, installed from the repository root by build.sh (--with ..).
  - markdown-in-template
nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Examples: examples.md
  - How it works: architecture.md
  - API reference: api.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Changelog: changelog.md
