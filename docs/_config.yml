# this_file: docs/_config.yml
title: vexy-mkdocs-markdown-in-template
description: Write Markdown inside your MkDocs theme's Jinja2 templates.
remote_theme: just-the-docs/just-the-docs
url: https://vexyart.github.io/vexy-mkdocs-markdown-in-template

aux_links:
  GitHub: https://github.com/vexyart/vexy-mkdocs-markdown-in-template
  PyPI: https://pypi.org/project/vexy-mkdocs-markdown-in-template/

color_scheme: dark

plugins:
  - jekyll-remote-theme

exclude:
  - Gemfile
  - Gemfile.lock
